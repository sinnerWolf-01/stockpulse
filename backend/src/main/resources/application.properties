spring.application.name=stockpulse
server.port=8080

spring.datasource.url=jdbc:h2:mem:stockpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true

stockpulse.signals.demand-multiplier=2.0
stockpulse.signals.minimum-demand-velocity=1

llm.base-url=${LLM_BASE_URL:}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:}
llm.product=${LLM_PRODUCT:}
llm.cookie=${LLM_COOKIE:}

stockpulse.strategy.pricing=${STOCKPULSE_PRICING_STRATEGY:rule}
stockpulse.strategy.reorder=${STOCKPULSE_REORDER_STRATEGY:rule}
stockpulse.ai.pricing.max-change-percent=${STOCKPULSE_AI_PRICING_MAX_CHANGE_PERCENT:0.20}
stockpulse.ai.pricing.minimum-price=${STOCKPULSE_AI_PRICING_MINIMUM_PRICE:0.01}
stockpulse.ai.reorder.max-multiplier=${STOCKPULSE_AI_REORDER_MAX_MULTIPLIER:10}
